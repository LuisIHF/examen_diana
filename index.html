function star(a){const c=[['Amarillo','#f5d100',0],['Naranja','#f28c1e',60],['Rojo','#d62828',120],['Violeta','#7b2cbf',180],['Azul','#1d4ed8',240],['Verde','#2a9d3f',300]];
let s='<svg viewBox="0 0 300 280" width="260"><g stroke="currentColor" fill="none" stroke-width="2"><polygon points="150,10 270,215 30,215"/><polygon points="150,260 270,55 30,55"/><polygon points="150,95 190,118 190,162 150,185 110,162 110,118"/></g>';
c.forEach(([n,col,d])=>{const r=Math.PI*(d-90)/180,cx=150+118*Math.cos(r),cy=135+118*Math.sin(r);
s+='<circle cx="'+cx+'" cy="'+cy+'" r="17" fill="'+(a?col:'none')+'" stroke="currentColor"/>'+(a?'<text x="'+cx+'" y="'+(cy+(d%120?-22:32))+'" font-size="11" text-anchor="middle" fill="currentColor">'+n+'</text>':'')});
return s+'</svg>'}
function head(){return '<svg viewBox="0 0 200 240" width="200"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M40 120C30 40 80 15 100 15s70 25 60 105c-5 40-20 55-20 70H60c0-15-15-30-20-70z"/><path d="M60 190v35h80v-35"/></g></svg>'}
let mode=1,key=false;
function opts(c,d,r){const a=d.slice(0,3);a.splice(r%(a.length+1),0,c);return a}
let S={};
function render(){const o=document.getElementById('out'),E=sel.value;let h='',K=[],id=0;
const nm=()=>E+'|'+mode+'|'+(id++);
const ta=()=>'<textarea rows="2" placeholder="Escribe tu respuesta" data-n="'+nm()+'"></textarea>';
const ip=()=>'<input type="text" data-n="'+nm()+'">';
const rg=(arr,ci,inl)=>{const n=nm();return arr.map((t,j)=>'<label class="'+(inl?'i ':'o ')+(j===ci?'right':'')+'"><input type="radio" name="'+n+'" value="'+j+'" data-ok="'+(j===ci?1:0)+'"'+(S[n]==j?' checked':'')+'> '+L[j]+') '+t+'</label>').join('')};
Q.forEach((q,i)=>{const n=i+1;h+='<div class="q"><b class="n">'+n+'.</b> '+q.t;
if(q.k==='star')h+=star(mode===2);
else if(q.k==='head')h+=head();
else if(q.k==='m'){if(mode===1)h+=ta();else{const a=opts(q.c,q.d,i),ci=a.indexOf(q.c);K.push(n+L[ci]);h+=rg(a,ci)}}
else if(q.k==='p'){q.P.forEach(([l,ans],j)=>{if(mode===1)h+='<div class="pt">'+l+': '+ip()+'</div>';else{const pool=[...new Set(q.P.map(z=>z[1]))].filter(z=>z!==ans);const d=[];for(let t=0;t<Math.min(3,pool.length);t++)d.push(pool[(j+t)%pool.length]);const a=opts(ans,d,i+j),ci=a.indexOf(ans);K.push(n+'.'+(j+1)+L[ci]);h+='<div class="pt">'+l+':<br>'+rg(a,ci,1)+'</div>'}})}
else if(q.k==='x'){if(mode===1)h+='<div class="meta" style="margin-left:18px">Opciones: '+q.O.join(' · ')+'</div>';q.I.forEach((t,j)=>{if(mode===1)h+='<div class="pt">'+t+' → '+ip()+'</div>';else{K.push(n+'.'+(j+1)+L[q.A[j]]);h+='<div class="pt">'+t+'<br>'+rg(q.O,q.A[j],1)+'</div>'}})}
h+='</div>'});
if(mode===2)h+='<div class="q"><b>Clave:</b> <span class="meta">'+K.join(' · ')+'</span></div>';
o.innerHTML=h;o.className=key&&mode===2?'k':'';
o.querySelectorAll('[data-n]').forEach(e=>e.value=S[e.dataset.n]||'');
bk.style.display=bg.style.display=mode===2?'':'none';sc.textContent=''}
document.getElementById('out').addEventListener('input',e=>{const t=e.target;if(t.dataset.n)S[t.dataset.n]=t.value;if(t.type==='radio')S[t.name]=t.value});
bg.onclick=()=>{let ok=0,tot=0,un=0;const g={};out.querySelectorAll('input[type=radio]').forEach(r=>{(g[r.name]=g[r.name]||[]).push(r)});
Object.values(g).forEach(a=>{tot++;a.forEach(r=>r.parentElement.classList.remove('good','bad'));const c=a.find(r=>r.checked);if(!c){un++;return}if(c.dataset.ok==='1'){ok++;c.parentElement.classList.add('good')}else c.parentElement.classList.add('bad')});
sc.textContent='Aciertos: '+ok+' / '+tot+(un?' ('+un+' sin responder)':'')};
b1.onclick=()=>{mode=1;b1.className='on';b2.className='';render()};

bk.onclick=()=>{key=!key;bk.textContent=key?'Ocultar clave':'Mostrar clave';out.className=key?'k':''};
render();
